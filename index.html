<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>まなびログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#eceee9; --grid:rgba(20,32,31,.055);
  --surface:#fcfcfb; --surface-2:#f3f4f0;
  --ink:#14201f; --ink-2:#4b5754; --muted:#6a7572;
  --line:#dfe3de; --line-2:#c3cac5;
  --btn:#14201f; --btn-fg:#fcfcfb;
  --focus:#2a78d6; --ok:#006300; --bad:#b42f2f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --hi:#2a78d6; --dim:#a9b6c8; --track:#dbe7f7;
  --h0:#e8eae5; --h1:#b7d3f6; --h2:#86b6ef; --h3:#3987e5; --h4:#1c5cab; --h5:#0d366b;
  --tb-fs:80%; --tb-fl:78%; --tb-fld:68%; --tb-soon:#8a5300;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --grid:rgba(255,255,255,.04);
    --surface:#1a1a19; --surface-2:#242523;
    --ink:#f1f4f0; --ink-2:#c3c9c5; --muted:#9aa3a0;
    --line:#2c2c2a; --line-2:#3f413e;
    --btn:#f1f4f0; --btn-fg:#14201f;
    --focus:#5aa0f0; --ok:#3fcf3f; --bad:#ee7a7a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --hi:#3987e5; --dim:#4b5870; --track:#26364d;
    --h0:#2c2c2a; --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#6da7ec; --h5:#b7d3f6;
    --tb-fs:46%; --tb-fl:26%; --tb-fld:32%; --tb-soon:#f0c46c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --grid:rgba(255,255,255,.04);
  --surface:#1a1a19; --surface-2:#242523;
  --ink:#f1f4f0; --ink-2:#c3c9c5; --muted:#9aa3a0;
  --line:#2c2c2a; --line-2:#3f413e;
  --btn:#f1f4f0; --btn-fg:#14201f;
  --focus:#5aa0f0; --ok:#3fcf3f; --bad:#ee7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --hi:#3987e5; --dim:#4b5870; --track:#26364d;
  --h0:#2c2c2a; --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#6da7ec; --h5:#b7d3f6;
  --tb-fs:46%; --tb-fl:26%; --tb-fld:32%; --tb-soon:#f0c46c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:var(--f-body); font-size:15px; line-height:1.65;
  padding-inline:16px; padding-block:0 96px;
  word-break:auto-phrase; line-break:strict;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 12px}
.brand{font:700 22px/1.2 var(--f-disp);display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.brand svg{width:24px;height:24px;flex:none}
.today-l{font-size:13px;color:var(--ink-2)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.banner p{flex:1 1 220px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.card h2{font:700 16px/1.4 var(--f-disp);margin-bottom:12px}
.card .sub{font-size:13px;color:var(--ink-2);margin-top:-6px;margin-bottom:12px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
@media(min-width:820px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}.sgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
label.l,.l{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin:14px 0 6px}
.l:first-of-type{margin-top:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num)}
textarea{min-height:72px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 120px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;text-align:center}
.btn.pri{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.sm{min-height:38px;padding:4px 14px;font-weight:500;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btns .btn{flex:1 1 140px}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface)}
.chip .dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.chip.add{border-style:dashed;background:none;color:var(--ink-2)}
.chip .dot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip.add.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);border-style:solid}
.chip.on .dot{box-shadow:0 0 0 2px var(--btn-fg)}
.tagedit{margin-top:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.tagedit .l:first-of-type{margin-top:12px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swp{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface-2);box-shadow:0 0 0 1px var(--line-2);padding:0}
.swp.on{box-shadow:0 0 0 2px var(--ink)}
.swatches input[type=color]{width:46px;height:38px;padding:2px;min-height:0;border-radius:10px;cursor:pointer}
.prev{margin-top:14px}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;min-height:38px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btn-fg);font-weight:700}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.presets .seg button{padding:6px 12px;font-family:var(--f-num)}
.presets input{width:88px}
.sheet{margin-top:18px;padding-top:6px;border-top:1px solid var(--line)}
.sheet h3{font:700 16px/1.4 var(--f-disp);margin:14px 0 4px}
.focusin{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fbtn{min-height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font:500 17px var(--f-num)}
.fbtn.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.fcap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:4px}
.big-today{font:700 34px/1.2 var(--f-body)}
.big-today small{font-size:16px;font-weight:500;margin-inline:2px 8px}
.goalrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:14px;color:var(--ink-2)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font:500 18px/1 var(--f-num)}
.step b{font:500 16px var(--f-num);color:var(--ink);min-width:3.2ch;text-align:center}
.meter{height:10px;border-radius:99px;background:var(--track);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hi);border-radius:99px;width:0}
.msg{font-size:14px;margin-top:8px;color:var(--ink-2)}
.msg.ok{color:var(--ok);font-weight:700}
.result p{font-size:14.5px;margin-top:6px}
.result p:first-of-type{margin-top:0;font-weight:700;font-size:15.5px}
.heat{display:grid;grid-template-columns:3.2em repeat(7,minmax(0,42px));gap:4px;align-items:center;width:max-content;max-width:100%}
.hl{font-size:11px;color:var(--muted);text-align:center}
.hc{display:block;aspect-ratio:1;border-radius:6px;background:var(--h0)}
.hc.fut{background:none}
.hc.h1{background:var(--h1)}.hc.h2{background:var(--h2)}.hc.h3{background:var(--h3)}.hc.h4{background:var(--h4)}.hc.h5{background:var(--h5)}
.hc.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend .sw{display:inline-flex;gap:3px;align-items:center}
.legend .sw i{width:14px;height:14px;border-radius:4px;display:block}
.grp{margin-top:18px}
.grp:first-child{margin-top:0}
.grp h3{font:700 14px/1.4 var(--f-disp);display:flex;justify-content:space-between;gap:10px;color:var(--ink-2);padding-bottom:6px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .t{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.item .t span{overflow-wrap:anywhere}
.item .dot{width:12px;height:12px;border-radius:50%;flex:none}
.item .v{font:500 15px var(--f-num);text-align:right}
.item .m{grid-column:1;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.item .x{grid-column:2;text-align:right}
.fd{display:inline-flex;gap:2px;vertical-align:middle}
.fd i{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:block}
.fd i.on{background:var(--ink)}
details.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 14px}
details.fold>summary{min-height:46px;display:flex;align-items:center;cursor:pointer;font-weight:700}
details.fold[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.fold>div{padding-bottom:14px}
details.slim{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:0}
details.slim>summary{min-height:48px;font-weight:500;color:var(--ink-2);font-size:14px}
details.slim[open]>summary{border-bottom:0;margin-bottom:4px}
details.slim>div{display:grid;gap:4px}
.note{font-size:13px;color:var(--ink-2)}
.warn{font-size:13px;color:var(--bad);margin-top:8px}
textarea.out{font-family:var(--f-num);font-size:12px;min-height:110px;margin-top:10px}
.filter{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.filter .lab{font-size:13px;color:var(--ink-2)}
.hero .cap{font-size:13px;color:var(--ink-2)}
.hero .big{font:700 clamp(48px,13vw,64px)/1.1 var(--f-body);letter-spacing:-.02em}
.hero .big small{font-size:20px;font-weight:500;margin-inline:3px 10px;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media(min-width:820px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:10px;padding:12px 14px;min-width:0}
.tile .a{font-size:12px;color:var(--ink-2)}
.tile .b{font:700 22px/1.3 var(--f-body)}
.tile .b small{font-size:13px;font-weight:500;margin-left:2px;color:var(--ink-2)}
.ins li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ins li:last-child{border-bottom:0;padding-bottom:0}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap;margin-top:2px}
.chart{width:100%;min-height:120px}
.chart svg{display:block;max-width:100%;overflow:visible}
.chart .tick{font:11px var(--f-num);fill:var(--muted)}
.chart .xl{font:11.5px var(--f-body);fill:var(--ink-2)}
.chart .xs{font:11px var(--f-body);fill:var(--muted)}
.chart .vlab{font:700 12px var(--f-num);fill:var(--ink)}
.chart .lab{font:12px var(--f-body);fill:var(--ink-2)}
.chart .halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .goal{stroke:var(--ink-2);stroke-width:1.25}
.chart .band{fill:var(--line);opacity:0}
.chart .hit{fill:transparent;outline:none}
.chart .hit:focus-visible{stroke:var(--focus);stroke-width:2}
.chart .cross{stroke:var(--ink-2);stroke-width:1;opacity:0}
.chart .pt{fill:var(--hi);stroke:var(--surface);stroke-width:2;outline:none}
.chart .pt:focus-visible{stroke:var(--focus)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:3px;display:block}
.empty{padding:22px 4px;text-align:center;color:var(--ink-2);font-size:14px}
.share li{padding:10px 0;border-bottom:1px solid var(--line)}
.share li:last-child{border-bottom:0;padding-bottom:0}
.share .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.share .nm{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.share .nm i{width:12px;height:12px;border-radius:3px;display:block}
.share .tm{font:500 14px var(--f-num)}
.share .bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.share .bar b{display:block;height:100%;border-radius:99px}
.share .amt{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.tv{margin-top:12px}
.tv summary{cursor:pointer;font-size:13px;color:var(--ink-2);min-height:36px;display:flex;align-items:center}
.tscroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--ink-2)}
.bar-nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar-in{max-width:980px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;min-height:60px;color:var(--ink-2);font-size:12px;border-top:3px solid transparent}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-selected=true]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.14);max-width:230px}
.tip .tt{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;line-height:1.7}
.tip .tr b{font:500 13px var(--f-num)}
.tip .tr span{color:var(--ink-2)}
.tip .tk{display:block;width:10px;height:3px;border-radius:2px;flex:none}
.tip .tk.none{background:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-fg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.gpill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:2px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:700 14px var(--f-num)}
.gpill small{font:500 12px var(--f-body);color:var(--ink-2)}
.hl.hwl{text-align:right;padding-right:4px}
.ckb{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.ckb i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--btn-fg)}
.ckb svg{width:16px;height:16px;opacity:0}
.ckb[aria-pressed=true] i{background:var(--btn);border-color:var(--btn)}
.ckb[aria-pressed=true] svg{opacity:1}
.rtt{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.rtt i{width:12px;height:12px;border-radius:50%;flex:none;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.rtt span{overflow-wrap:anywhere}
.rtm{font-size:12.5px;color:var(--ink-2);padding-left:20px}
.dow{display:flex;flex-wrap:wrap;gap:6px}
.dow button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font-weight:500}
.dow button[aria-pressed=true]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);font-weight:700}
.rform{margin-top:2px;margin-bottom:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rform .l:first-of-type{margin-top:12px}
.btn.danger.armed{background:var(--bad);color:var(--btn-fg)}
.linkbox{margin-top:14px;padding:12px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface-2)}
.lkchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lk{min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font:500 15px var(--f-num);overflow-wrap:anywhere}
.lk[aria-pressed=true]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.lk[disabled]{opacity:.5;cursor:not-allowed;text-decoration:line-through}
.tb{display:flex;flex-direction:column;gap:14px;min-width:0;max-width:720px}
.tb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

<script>
/* ====================================================================
   manabilog-game.js v2 ― まなびログ「ごほうび」(タスク完了+強化+アセンション+プレステージ)
   --------------------------------------------------------------------
   1回あたりのポイント =
       (10 + 加算) × 強化1の倍率 × 強化2の倍率 × … × 強化10の倍率 × プレステージ倍率 ^ プレステージ乗数

   ・タスクを完了する … 上の式のポイントがもらえる(最初は10)
   ・強化(1〜10)  … 最初のコストは 10^n。Lv0→Lv1にすると「加算」が 10^n 増える(以降ずっと)
                    Lvが1上がるごとに倍率 +0.20 (1, 1.20, 1.40 …) / コストは1Lvごとに×1.10
   ・上限(最初は10Lv) … 上限まで買うと「アセンション」。Lv1に戻る(倍率はそのまま)
                    コスト=上限の半分のLvのコスト / 次の上限+10 / 加算 +10^n / コスト増加率 +0.10
   ・プレステージ … 1e5pt以上で可能。ポイントと強化をリセット。
                    乗数 +0.10×(e-4)、倍率 ×10^(e-4)  (eは10の何乗か: 1e5→e=5)
   ・勉強の記録/確認項目 … 1回分(5分ごと・最大12回分)のポイントがもらえる(同じ項目は1回だけ)

   localStorage キー manabilog.game.v2 のみ使用(旧 v1 のデータは削除)

   [公開API]  awardItems(items) / awardSession(rec) / render(el) / getPoints() / getStars() / getTotal()
              onChange(fn) / exportData() / importData(o) / reset() / fmt(n)
   ==================================================================== */
(function(global){
'use strict';

const KEY='manabilog.game.v2', OLD_KEY='manabilog.game.v1';
const BASE_PTS=10, CAP0=10, CAP_STEP=10, MULT_STEP=0.20, G0=1.10, G_STEP=0.10;
const PRE_MIN=1e5, LOG_MAX=20, AWARDED_MAX=3000, SESSION_MIN=5, SESSION_MAX_PRESS=12;
const FAC=[['えんぴつ','✏️'],['ノート','📓'],['学習机','🪑'],['電気スタンド','💡'],['参考書','📚'],
           ['自習室','🏫'],['家庭教師','🧑‍🏫'],['塾','🏢'],['図書館','🏛️'],['大学','🎓']].map((a,i)=>({n:i+1,name:a[0],icon:a[1]}));
const p10=n=>Math.pow(10,n);
const r2=x=>Math.round(x*100)/100;
const freshFac=i=>({lv:0,asc:0,m:1,base:p10(i+1)*G0,g:G0});
function blank(){
  return {v:3,points:0,total:0,prestiges:0,presses:0,pm:1,pe:0,fac:FAC.map((f,i)=>freshFac(i)),awarded:[],sessions:[],log:[]};
}
function num(x,d){x=Number(x);return Number.isFinite(x)&&x>=0?x:d;}
function norm(o){
  if(!o||typeof o!=='object'||o.v!==3) return null;
  const b=blank();
  b.points=Math.floor(num(o.points,0)); b.total=Math.max(Math.floor(num(o.total,0)),b.points);
  b.prestiges=Math.floor(num(o.prestiges,0)); b.presses=Math.floor(num(o.presses,0));
  b.pm=Math.max(1,num(o.pm,1)); b.pe=num(o.pe,0);
  if(Array.isArray(o.fac)) FAC.forEach((F,i)=>{
    const x=o.fac[i]; if(!x||typeof x!=='object') return;
    const a=Math.floor(num(x.asc,0)), c=CAP0+CAP_STEP*a;
    b.fac[i]={lv:Math.min(c,Math.floor(num(x.lv,0))),asc:a,m:Math.max(1,num(x.m,1)),base:Math.max(1,num(x.base,b.fac[i].base)),g:Math.max(G0,num(x.g,G0))};
  });
  b.awarded=Array.isArray(o.awarded)?o.awarded.filter(x=>typeof x==='string').slice(-AWARDED_MAX):[];
  b.sessions=Array.isArray(o.sessions)?o.sessions.filter(x=>typeof x==='string').slice(-AWARDED_MAX):[];
  b.log=Array.isArray(o.log)?o.log.filter(x=>x&&typeof x.t==='string').slice(-LOG_MAX).map(x=>({t:x.t.slice(0,80),d:Number(x.d)||0,at:Number(x.at)||0})):[];
  return b;
}
function load(){
  let g=null;
  try{const raw=localStorage.getItem(KEY); if(raw) g=norm(JSON.parse(raw));}catch(e){}
  if(!g) g=blank();
  /* 旧ごほうびのデータは消す(同じ項目でポイントを二重にもらわないよう、IDだけ引き継ぐ) */
  try{
    const old=localStorage.getItem(OLD_KEY);
    if(old){
      const o=JSON.parse(old);
      if(o&&Array.isArray(o.awarded)) g.awarded=[...new Set(o.awarded.filter(x=>typeof x==='string').concat(g.awarded))].slice(-AWARDED_MAX);
      if(o&&Array.isArray(o.sessions)) g.sessions=[...new Set(o.sessions.filter(x=>typeof x==='string').concat(g.sessions))].slice(-AWARDED_MAX);
      localStorage.removeItem(OLD_KEY);
      localStorage.setItem(KEY,JSON.stringify(g));
    }
  }catch(e){}

}

function save(){try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}

const listeners=[], viewers=[];
function emit(info){
  save();
  listeners.forEach(f=>{try{f(info);}catch(e){}});

}
function pushLog(t,d){G.log.push({t:t,d:d,at:Date.now()}); if(G.log.length>LOG_MAX) G.log=G.log.slice(-LOG_MAX);}

/* ---------- 計算式 ---------- */
const capOf=f=>CAP0+CAP_STEP*f.asc;
const costOf=i=>{const f=G.fac[i]; return f.lv===0?p10(i+1):f.base*Math.pow(f.g,f.lv-1);};
const flatOf=i=>{const f=G.fac[i]; return f.lv>=1?p10(i+1)*(1+f.asc):0;};
const flatSum=()=>FAC.reduce((t,_,i)=>t+flatOf(i),0);
const multProd=()=>G.fac.reduce((t,f)=>t*f.m,1);
const preFactor=()=>G.pe>0?Math.pow(G.pm,G.pe):1;
const pressValue=()=>Math.max(1,Math.round((BASE_PTS+flatSum())*multProd()*preFactor()));
function gain(pts){G.points+=pts; G.total+=pts;}

/* ---------- 操作 ---------- */
function press(){
  const v=pressValue(); gain(v); G.presses++;
  emit({type:'press',pts:v}); return v;
}
function buy(i){
  const f=G.fac[i]; if(!f||f.lv>=capOf(f)) return false;
  const c=costOf(i); if(G.points<c) return false;
  G.points-=c; f.lv++; f.m=r2(f.m+MULT_STEP);
  pushLog(FAC[i].name+' Lv'+f.lv,-c);
  emit({type:'buy',i:i}); return true;
}
function ascend(i){
  const f=G.fac[i]; if(!f||f.lv<capOf(f)) return false;
  const half=capOf(f)/2;                          /* 上限の半分のLvのコスト */
  f.base=f.base*Math.pow(f.g,half-1);
  f.g=r2(f.g+G_STEP); f.asc++; f.lv=1;            /* 倍率 m はそのまま */
  pushLog(FAC[i].name+' アセンション('+f.asc+'回目)',0);
  emit({type:'asc',i:i}); return true;
}
function preE(){return G.points>=PRE_MIN?Math.floor(Math.log10(G.points)+1e-12):0;}
function preGain(){const k=preE()-4; return k>=1?{k:k,pe:r2(0.1*k),pm:p10(k)}:null;}
function prestige(){
  const g=preGain(); if(!g) return null;
  G.pe=r2(G.pe+g.pe); G.pm=G.pm*g.pm; G.prestiges++;
  G.points=0; G.fac=FAC.map((f,i)=>freshFac(i));
  pushLog('プレステージ(乗数 +'+g.pe+' / 倍率 ×'+fmt(g.pm)+')',0);
  emit({type:'prestige'}); return g;
}

/* ---------- 勉強・確認項目からのポイント ---------- */
function awardItems(list){
  if(!Array.isArray(list)||!list.length) return {pts:0,n:0,crits:0,parts:[]};
  const have=new Set(G.awarded); let n=0;
  list.forEach(x=>{const id=x&&typeof x.id==='string'?x.id:''; if(!id||have.has(id)) return; have.add(id); G.awarded.push(id); n++;});
  if(G.awarded.length>AWARDED_MAX) G.awarded=G.awarded.slice(-AWARDED_MAX);
  if(!n) return {pts:0,n:0,crits:0,parts:[]};
  const pts=pressValue()*n; gain(pts); pushLog('確認項目 '+n+'件を完了',pts);
  emit({type:'items',pts:pts,n:n});
  return {pts:pts,n:n,crits:0,parts:['確認項目 '+n+'件']};
}
function awardSession(rec){
  if(!rec||typeof rec!=='object') return {pts:0,crit:false,parts:[]};
  const id=String(rec.id||''); if(id&&G.sessions.includes(id)) return {pts:0,crit:false,parts:[]};
  const min=Math.max(0,Number(rec.min)||0); if(min<SESSION_MIN) return {pts:0,crit:false,parts:[]};
  const k=Math.min(SESSION_MAX_PRESS,Math.floor(min/5)), pts=pressValue()*k;
  gain(pts); pushLog('勉強の記録 '+Math.round(min)+'分',pts);
  if(id){G.sessions.push(id); if(G.sessions.length>AWARDED_MAX) G.sessions=G.sessions.slice(-AWARDED_MAX);}
  emit({type:'session',pts:pts});
  return {pts:pts,crit:false,parts:['勉強 '+k+'回分']};
}

/* ---------- 表示用 ---------- */
function fmt(n){
  if(!Number.isFinite(n)) return '∞';
  n=Math.round(n);
  if(Math.abs(n)<1e9) return n.toLocaleString('ja-JP');
  return n.toExponential(2).replace('e+','e');
}
function fx(n){
  if(!Number.isFinite(n)) return '∞';
  if(Math.abs(n)>=1e6) return n.toExponential(2).replace('e+','e');
  return String(Math.round(n*100)/100);
}

    const v=attrs[k]; if(v==null||v===false) continue;

const box=(label,val)=>h('div',{class:'b'},h('span',{text:label}),h('b',{text:val}));

      ?h('button',{type:'button',class:'mg-btn pri','aria-label':F.name+'をアセンションする',on:{click:()=>{ascend(i);}}},'アセンション')
      :h('button',{type:'button',class:'mg-btn'+(can?' pri':''),disabled:!can,'aria-label':F.name+'のレベルを上げる',on:{click:()=>{buy(i);}}},fmt(cost)+'pt');
    return h('div',{class:'mg-row'},
      h('div',{class:'mg-ic',text:F.icon}),
      h('div',{},h('div',{class:'mg-nm'},F.name,h('small',{text:'強化'+F.n+' ・ Lv '+f.lv+' / '+c})),
        h('div',{class:'mg-ds',text:info}),note?h('div',{class:'mg-ds',text:note}):null),

  });

    h('p',{class:'mg-sub2',text:'レベルを上げるたびに倍率が +0.20、コストは ×'+fx(G0)+'(アセンションごとに増加率が +0.10)。'}),rows);

    h('p',{class:'mg-sub2',text:'1e5(10万)pt以上でできます。ポイントと強化をリセットして、全体にかかる倍率(倍率^乗数)を強くします。'}),
    h('p',{class:'mg-sub',text:'いま: ×'+fx(G.pm)+' ^ '+fx(G.pe)+' = ×'+fx(pre)}),

       :h('p',{class:'mg-sub',text:'あと '+fmt(Math.max(0,PRE_MIN-G.points))+'pt でできます(いま '+fmt(G.points)+'pt)。'}),

      h('li',{text:'リセットされる: ポイント、強化のレベル・倍率・加算・アセンション'}),

    h('div',{style:'margin-top:12px'},
      h('button',{type:'button',class:'mg-btn danger'+(armPre?' armed':''),disabled:!pg,

          if(armPre){armPre=false;clearTimeout(armTimer);prestige();return;}

        }}},armPre?'もう一度タップでプレステージする':'プレステージする')));

  const logs=G.log.slice().reverse().slice(0,10);
  const log=h('div',{class:'mg-card mg-log wide'},h('h2',{text:'さいきんの動き'}),
    logs.length?h('ul',{},logs.map(l=>h('li',{},h('span',{text:l.t}),h('span',{class:l.d>0?'mg-up':'mg-dn',text:(l.d>0?'+':l.d<0?'−':'')+fmt(Math.abs(l.d))+(l.d?'pt':'')}))))

}

function exportData(){return JSON.parse(JSON.stringify(G));}
function importData(o){
  const n=norm(o); if(!n) return;
  const aw=[...new Set(G.awarded.concat(n.awarded))].slice(-AWARDED_MAX), ss=[...new Set(G.sessions.concat(n.sessions))].slice(-AWARDED_MAX);
  if(n.total>G.total||(n.total===G.total&&n.prestiges>G.prestiges)) G=n;

  onChange:fn=>{if(typeof fn==='function') listeners.push(fn);},

};
})(window);

  if(!a) return;
  for(const k in a){
    const v=a[k];

}

function rng(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function makeSample(){
  const r=rng(20261007), out=[], now=Date.now(), today0=startOfDay(now);
  const pace={ja:.28,jb:.2,ma:.22,en:.7,sc:.24,so:.3,ot:.25};
  const weights=[['ja',.16],['jb',.1],['ma',.24],['en',.2],['sc',.12],['so',.12],['ot',.06]];
  const pick=()=>{let x=r(),t=0;for(const w of weights){t+=w[1];if(x<=t)return SUBJ[w[0]]?w[0]:SUBJECTS[0].id;}return SUBJECTS[0].id;};
  const mins=[15,20,25,30,35,40,45,50,60,75,90];
  const lenMult=m=>.74+.46*Math.exp(-Math.pow((m-40)/22,2));
  const todMult=hr=>hr<9?1.1:hr<12?1.04:hr<17?.98:hr<20?1:.86;
  let seq=0;
  for(let off=27;off>=0;off--){
    const day0=addDays(today0,-off), dow=new Date(day0).getDay(), weekend=(dow===0||dow===6);
    let slots=[[6.5,7.6],[16.5,18.4],[20,21.6]];
    if(weekend) slots=slots.concat([[9,11],[13.5,15.5]]);
    let n;
    if(off===0){
      if(new Date(now).getHours()<10) continue;
      n=1; slots=[[Math.max(6.5,new Date(now).getHours()-3),Math.max(6.6,new Date(now).getHours()-2.5)]];
    }else{
      if(r()>(weekend?.82:.72)) continue;
      n=1+Math.floor(r()*3);
    }
    const chosen=slots.slice().sort(()=>r()-.5).slice(0,n).sort((a,b)=>a[0]-b[0]);
    for(const sl of chosen){
      const sj=pick(), m=mins[Math.floor(r()*mins.length)];
      const hr=sl[0]+r()*(sl[1]-sl[0]);
      const start=day0+Math.round(hr*3600000);
      const mult=lenMult(m)*todMult(hr)*(.88+r()*.24)*(1+(27-off)*.004);
      const amount=Math.max(1,Math.round((pace[sj]||.25)*m*mult));
      const focus=Math.max(1,Math.min(5,Math.round(2.6+(mult-.9)*5+(r()-.5)*1.6)));
      out.push({id:'ex'+(seq++),start:start,min:m,subject:sj,task:'',amount:amount,unit:tagOf(sj).unit,focus:focus,note:''});
    }
  }
  return out;
}

/* ---------- 進捗計算 ---------- */
function taskProg(tk){const total=tk.items.length,done=tk.items.filter(i=>i.done).length;return {done:done,total:total,p:total?done/total:0};}
function subjProg(sb){let d=0,t=0;sb.tasks.forEach(x=>{const r=taskProg(x);d+=r.done;t+=r.total;});return {done:d,total:t,p:t?d/t:0};}
const STOPS=[[0,6],[0.4,34],[0.7,88],[1,150]];
function hue(p){
  for(let i=1;i<STOPS.length;i++){
    if(p<=STOPS[i][0]){const a=STOPS[i-1],b=STOPS[i];return a[1]+(b[1]-a[1])*((p-a[0])/(b[0]-a[0]));}
  }
  return 150;
}
function barSty(p){return '--p:'+Math.round(p*100)+'%;--bh1:'+hue(Math.max(0,p-0.3)).toFixed(0)+';--bh2:'+hue(p).toFixed(0);}
function bRest(due,complete){
  const n=daysToYmd(due);
  if(complete) return {t:'完了',c:'ok'};
  if(n<0) return {t:'期限切れ '+(-n)+'日',c:'late'};
  if(n===0) return {t:'今日まで',c:'soon'};
  if(n===1) return {t:'明日まで',c:'soon'};
  return {t:'あと'+n+'日',c:n<=3?'soon':''};
}
function bDueChip(due,complete,inh){
  if(!due) return '';
  const r=bRest(due,complete);
  return '<span class="tb-due '+r.c+(inh?' inh':'')+'">'+fmtMD(due)+' · '+r.t+'</span>';
}
function bNext(){
  let best=null;
  S.board.subjects.forEach(sb=>sb.tasks.forEach(tk=>{
    const pr=taskProg(tk); if(pr.total>0&&pr.done===pr.total) return;
    const d=tk.due||sb.due; if(!d) return;
    const n=daysToYmd(d);
    if(!best||n<best.n) best={n:n,d:d,s:sb.name,t:tk.name};

}

/* ---------- 確認項目の入力(範囲) ---------- */
function parseItems(text,unit){
  unit=(unit||'').trim();
  const norm=String(text||'').normalize('NFKC').trim();
  if(!norm) return {labels:[],cut:false};
  const toks=norm.split(/[,、，\s]+/).filter(Boolean);
  const re=/^(\d+)(?:[-~〜～ー−–—](\d+))?$/;
  if(!toks.every(t=>re.test(t))) return {labels:[norm.slice(0,60)],cut:false};
  const out=[]; let cut=false;
  toks.forEach(t=>{
    const m=re.exec(t); let a=parseInt(m[1],10), b=m[2]?parseInt(m[2],10):a;
    if(a>b){const x=a;a=b;b=x;}
    for(let n=a;n<=b;n++){if(out.length>=200){cut=true;return;}out.push(String(n)+unit);}
  });
  return {labels:out,cut:cut};
}
function previewText(text,unit){
  const r=parseItems(text,unit),L=r.labels;
  if(!L.length) return '例: 8〜13 と入力すると 8, 9, 10, 11, 12, 13 の6項目ができます。';
  const sx=L.length<=8?L.join('、'):L.slice(0,3).join('、')+' … '+L[L.length-1];
  return '→ '+sx+'（'+L.length+'項目'+(r.cut?'・200個まで':'')+'）';
}

  return S.routines.filter(r=>r.days.includes(dow)).sort((a,b)=>idx(a.subject)-idx(b.subject)||(a.name<b.name?-1:1));

function routineState(r){
  const k=dkey(Date.now()), nm=normName(r.name);
  const mins=S.sample?0:sum(S.sessions.filter(x=>dkey(x.start)===k&&x.subject===r.subject&&(!nm||normName(x.task).includes(nm))),x=>x.min);
  const checked=(S.checks[k]||[]).includes(r.id);

function toggleCheck(r){

/* ---------- 毎日のタスクの共有(コピー&貼り付け) ---------- */
function routineList(){return S.routines.filter(r=>SUBJ[r.subject]);}
function encodeRoutines(){
  const arr=routineList().map(r=>{const tg=tagOf(r.subject);return {s:tg.subj||tg.name,n:tg.name,m:r.name||'',d:r.days,t:r.min||0,u:tg.unit,c:tg.c};});
  return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,r:arr})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeRoutines(text){
  const m=/RTP1:([A-Za-z0-9_-]+)/.exec(text||''); if(!m) return null;
  try{
    let b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o||!Array.isArray(o.r)) return null;
    const out=[];
    o.r.slice(0,40).forEach(x=>{
      if(!x||typeof x!=='object') return;
      const sj=cutStr(x.s,20), nm=cutStr(x.n,20); if(!sj||!nm) return;
      const days=[...new Set((Array.isArray(x.d)?x.d:[]).map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6))].sort((a,b)=>a-b);
      if(!days.length) return;
      const mn=Math.round(Number(x.t));
      out.push({s:sj,n:nm,m:cutStr(x.m,40),d:days,t:(mn>0&&mn<=600)?mn:0,u:UNITS.indexOf(x.u)>=0?x.u:'ページ',
        c:(typeof x.c==='string'&&(/^#[0-9a-f]{6}$/i.test(x.c)||/^var\(--s[1-6]\)$/.test(x.c)))?x.c:''});
    });
    return out.length?out:null;
  }catch(e){return null;}
}
function routineShareText(){
  if(!routineList().length) return '共有できるデータがまだありません。';
  const L=['【毎日のタスク】共有データ','アプリの「タスク」→「今日と毎日」→「⋯」の取り込み欄に、この文章をそのまま貼り付けてください。',''];
  DOWS.forEach(d=>{
    const items=routinesOn(d).filter(r=>SUBJ[r.subject]);
    L.push(WD[d]+'曜日: '+(items.length?items.map(r=>{const tg=tagOf(r.subject),mm=rMemo(r,tg);return tl(tg)+(mm?' '+mm:'')+(r.min>0?'('+r.min+'分)':'');}).join('、'):'なし'));
  });
  L.push('','RTP1:'+encodeRoutines());
  return L.join('\n');
}
function routineImpPreview(text){
  if(!String(text||'').trim()) return '';
  const d=decodeRoutines(text);
  if(!d) return '共有データが見つかりません。「RTP1:」で始まる行まで含めて貼り付けてください。';
  const tags=new Set(d.map(x=>normName(x.s)+'|'+normName(x.n)));
  return d.length+'件の毎日のタスク(タグ'+tags.size+'個)を読み取りました。';
}
function applyRoutines(list,replace){
  let added=0,newTags=0,skipped=0; const out=[];
  list.forEach(x=>{
    let tg=SUBJECTS.find(t=>normName(t.name)===normName(x.n)&&normName(t.subj||t.name)===normName(x.s));
    if(!tg){
      if(SUBJECTS.length>=9999){skipped++;return;}
      tg={id:newTagId(),name:x.n,subj:x.s,unit:x.u,c:x.c||subjColor(x.s)||PRESET_COLORS[SUBJECTS.length%PRESET_COLORS.length]};
      SUBJECTS.push(tg);rebuildSubj();newTags++;
    }
    out.push({id:bid(),subject:tg.id,name:x.m,days:x.d,min:x.t});
  });
  if(newTags) afterTagChange();
  const base=(replace||S.rsample)?[]:S.routines.slice();
  const sig=r=>r.subject+'|'+normName(r.name)+'|'+r.days.join('');
  const have=new Set(base.map(sig));
  out.forEach(r=>{if(base.length>=40){skipped++;return;} if(have.has(sig(r))) return; have.add(sig(r)); base.push(r); added++;});
  S.routines=base;S.rsample=false;
  return {added:added,newTags:newTags,skipped:skipped};
}

function bClick(e){
  const el=e.target.closest('[data-ba]'); if(!el||!BD.host.contains(el)) return;
  const a=el.dataset.ba, sid=el.dataset.s, tid=el.dataset.t, iid=el.dataset.i;
  const sb=sid?S.board.subjects.find(x=>x.id===sid):null;
  const tk=(sb&&tid)?sb.tasks.find(x=>x.id===tid):null;
  if(a==='toggle-s'&&sb){sb.open=!sb.open;bCommit();}
  else if(a==='toggle-t'&&tk){tk.open=!tk.open;bCommit();}
  else if(a==='edit-s'&&sb){BD.edit=BD.edit===sid?null:sid;BD.confirm=null;bRender();}
  else if(a==='edit-t'&&tk){BD.edit=BD.edit===tid?null:tid;BD.confirm=null;bRender();}
  else if(a==='close-edit'){BD.edit=null;BD.confirm=null;bRender();}
  else if(a==='open-add'){BD.add=el.dataset.k;BD.focus=el.dataset.f1;bRender();}
  else if(a==='close-add'){BD.add=null;bRender();}
  else if(a==='toggle-share'){BD.share=!BD.share;BD.confirm=null;bRender();}
  else if(a==='chip'&&tk){const it=tk.items.find(x=>x.id===iid);if(it){it.done=!it.done;bCommit();if(it.done){const g=gAwardItems([{id:it.id,label:it.label}]);if(g.pts) toast('+'+ManabiGame.fmt(g.pts)+'pt');}}}
  else if(a==='all'&&tk){const v=el.dataset.v==='1';const fresh=[];tk.items.forEach(x=>{if(v&&!x.done) fresh.push({id:x.id,label:x.label});x.done=v;});bCommit();if(fresh.length){const g=gAwardItems(fresh);if(g.pts) toast('+'+ManabiGame.fmt(g.pts)+'pt('+g.n+'件)');}}
  else if(a==='del-item'&&tk){tk.items=tk.items.filter(x=>x.id!==iid);bCommit();}
  else if(a==='clear-due'&&sb){(tk||sb).due=null;bCommit();}
  else if(a==='del-s'&&sb){bAskDel('del-s:'+sid,()=>{S.board.subjects=S.board.subjects.filter(x=>x.id!==sid);BD.edit=null;});}
  else if(a==='del-t'&&tk){bAskDel('del-t:'+tid,()=>{sb.tasks=sb.tasks.filter(x=>x.id!==tid);BD.edit=null;});}
  else if(a==='clear-sample'){S.board={subjects:[]};S.bsample=false;BD.edit=null;bCommit();}
  else if(a==='study'&&tk){
    const tm=S.timer;
    if(tm.status!=='idle'){toast('いまのタイマーを終えてから選んでください');return;}
    let tg=tagForTask(sb,tk), made=false;
    if(!tg){
      if(SUBJECTS.length>=20){toast('タグが20個あります。使わないタグを消してから選んでください');return;}
      tg={id:newTagId(),name:tk.name.slice(0,20),subj:sb.name.slice(0,20),unit:'ページ',c:subjColor(sb.name)||PRESET_COLORS[SUBJECTS.length%PRESET_COLORS.length]};
      SUBJECTS.push(tg);rebuildSubj();afterTagChange();made=true;
    }
    setTab('timer'); selectTask(tg.id,'');
    toast(made?'タスクタグ「'+tg.name+'」をつくって、タイマーを始めました':'タイマーを始めました');
  }
  else if(a==='add-subject'){
    const n=bval('tb-ns').trim(); if(!n){toast('教科名を入力してください');return;}
    if(S.bsample){S.board={subjects:[]};S.bsample=false;}
    S.board.subjects.push({id:bid(),name:n.slice(0,60),due:bval('tb-nsd')||null,open:true,tasks:[]});
    BD.add=null;bCommit();toast('教科を追加しました');
  }
  else if(a==='add-task'&&sb){
    const n=bval('tb-nt-'+sid).trim(); if(!n){toast('タスク名を入力してください');return;}
    sb.tasks.push({id:bid(),name:n.slice(0,60),due:bval('tb-ntd-'+sid)||null,open:true,items:[]});
    BD.add=null;bCommit();toast('タスクを追加しました');
  }
  else if(a==='add-item'&&tk){
    const r=parseItems(bval('tb-ni-'+tid),bval('tb-nu-'+tid));
    if(!r.labels.length){toast('範囲か内容を入力してください');return;}
    const have={};tk.items.forEach(x=>{have[x.label]=1;});
    let added=0;
    r.labels.forEach(l=>{if(!have[l]){have[l]=1;tk.items.push({id:bid(),label:l,done:false});added++;}});
    BD.add=null;bCommit();
    toast(added?added+'件の確認項目を追加しました':'同じ項目がすでにあります');
  }
  else if(a==='copy-share'){
    if(!S.board.subjects.length){toast('共有できるデータがありません');return;}
    const ta=document.getElementById('tb-share-out'), txt=ta.value;
    const fail=()=>{ta.focus();ta.select();toast('選択しました。コピーして使ってください');};
    try{navigator.clipboard.writeText(txt).then(()=>{toast('コピーしました。貼り付けて送れます');},fail);}catch(err){fail();}
  }
  else if(a==='import-add'||a==='import-replace'){
    const data=decodeShare(bval('tb-imp'));
    if(!data){toast('取り込める共有データが見つかりません');return;}
    const apply=replace=>{
      if(replace||S.bsample) S.board={subjects:data}; else S.board={subjects:S.board.subjects.concat(data)};
      S.bsample=false;BD.share=false;BD.edit=null;BD.add=null;bclr('tb-imp');

    if(a==='import-add'){apply(false);bCommit();toast(data.length+'教科を取り込みました');}
    else bAskDel('import-replace',()=>{apply(true);toast(data.length+'教科で置き換えました');});
  }
}

/* ---------- efficiency ---------- */
function baselines(list){
  const m={};
  list.forEach(x=>{
    if(x.amount>0&&x.min>=5){
      const k=x.subject+'|'+x.unit; const o=m[k]||(m[k]={a:0,m:0,n:0});
      o.a+=x.amount;o.m+=x.min;o.n++;
    }
  });
  return m;
}
function withEff(list){
  const b=baselines(list);
  return list.map(x=>{
    let eff=null; const bb=b[x.subject+'|'+x.unit];
    if(x.amount>0&&x.min>=5&&bb&&bb.n>=3) eff=(x.amount/x.min)/(bb.a/bb.m)*100;
    return Object.assign({},x,{eff:eff});
  });
}
function wavg(list){
  let a=0,b=0;
  list.forEach(x=>{a+=x.eff*x.min;b+=x.min;});
  return b?a/b:null;
}
function dayMap(list){
  const m=new Map();
  list.forEach(x=>{
    const k=dkey(x.start); let o=m.get(k);
    if(!o){o={min:0,by:{},list:[]};m.set(k,o);}
    o.min+=x.min;o.by[x.subject]=(o.by[x.subject]||0)+x.min;o.list.push(x);
  });
  return m;
}
function streak(){
  const set=new Set(S.sessions.map(x=>dkey(x.start)));
  let d=startOfDay(Date.now());
  if(!set.has(dkey(d))) d=addDays(d,-1);
  let n=0;
  while(set.has(dkey(d))){n++;d=addDays(d,-1);}
  return n;
}

/* ---------- tooltip & toast ---------- */
const tipEl=$('#tip'), toastEl=$('#toast');
function showTip(x,y,c){
  tipEl.replaceChildren(
    h('div',{class:'tt',text:c.title}),
    ...c.rows.map(r=>h('div',{class:'tr'},
      h('i',{class:'tk'+(r.color?'':' none'),style:r.color?'background:'+r.color:null}),
      h('b',{text:r.value}),h('span',{text:r.label})))
  );
  tipEl.hidden=false;
  const rc=tipEl.getBoundingClientRect();
  let left=x+14, top=y-rc.height-12;
  if(left+rc.width>window.innerWidth-8) left=x-rc.width-14;
  if(left<8) left=8;
  if(top<8) top=y+18;
  tipEl.style.left=left+'px'; tipEl.style.top=top+'px';
}
function hideTip(){tipEl.hidden=true;}
function attachTip(node,get){
  node.setAttribute('data-tip','1');
  const show=e=>{
    const c=get(); if(!c) return;
    let x,y;
    if(e&&e.type!=='focus'&&e.clientX!=null){x=e.clientX;y=e.clientY;}
    else{const r=node.getBoundingClientRect();x=r.left+r.width/2;y=r.top;}
    showTip(x,y,c);
  };
  ['pointerenter','pointermove','pointerdown','focus'].forEach(ev=>node.addEventListener(ev,show));
  node.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip();});
  node.addEventListener('blur',hideTip);
}
document.addEventListener('pointerdown',e=>{
  if(!(e.target.closest&&e.target.closest('[data-tip]'))) hideTip();
});
let toastTimer=0;
function toast(msg){
  toastEl.textContent=msg;toastEl.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.hidden=true;},2600);
}

/* ---------- ごほうびゲーム連携(manabilog-game.js) ---------- */
function gAwardItems(list){
  if(S.bsample||!list||!list.length) return {pts:0,n:0,crits:0};
  try{return ManabiGame.awardItems(list);}catch(e){return {pts:0,n:0,crits:0};}
}
function gAwardSession(rec){
  try{return ManabiGame.awardSession(rec);}catch(e){return {pts:0,crit:false};}
}
function gameMsg(base,gs,ln){
  const pts=((gs&&gs.pts)||0)+((ln&&ln.pts)||0), crit=!!((gs&&gs.crit)||(ln&&ln.crits));
  return pts?base+'。+'+ManabiGame.fmt(pts)+'pt'+(crit?' 大成功!':''):base;
}
/* GP: ポイント獲得アニメーション中だけ、ポイント表示欄に「見せる値」を持つ。
   本当のポイントは ManabiGame が先に正しく加算していて、GP は表示だけを遅らせる。 */
let GP=null;
function updateGamePill(){
  const b=$('#gamePt'); if(!b) return;
  const st=ManabiGame.getStars();
  const pts=GP?GP.shown:ManabiGame.getPoints();
  b.replaceChildren(h('span',{text:'⭐ '+ManabiGame.fmt(pts)}),h('small',{text:st>0?'pt ★'+st:'pt'}));
}
ManabiGame.onChange(updateGamePill);
$('#gamePt').addEventListener('click',()=>setTab('game'));
const reduceMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- ポイント獲得アニメーション ---------- */
function playReward(o){
  const pill=$('#gamePt'), pts=Math.max(0,Math.floor(o.pts||0));
  const finish=()=>{GP=null;updateGamePill();};
  if(!pts||!pill||!GP||reduceMotion()||!document.body.animate){finish();return;}
  try{window.scrollTo(0,0);}catch(e){}
  /* 1. 効率値に比例した彩度で、教科の色が背景でフラッシュする */
  const sat=o.eff==null?1:Math.max(.25,Math.min(2.2,o.eff/100));
  const fl=h('div',{class:'flash',style:'background:'+o.color+';filter:saturate('+sat.toFixed(2)+')'});
  document.body.append(fl);
  const fa=fl.animate([{opacity:0},{opacity:.42,offset:.2},{opacity:0}],{duration:1100,easing:'ease-out'});
  fa.onfinish=()=>fl.remove(); fa.oncancel=()=>fl.remove();
  /* 2〜6. 確定ボタン付近からポイントアイコンを1フレームごとに出す */
  const n=Math.min(pts,60), base=Math.floor(pts/n), rem=pts%n;
  const from=o.from||{left:window.innerWidth/2-20,top:window.innerHeight*0.6,width:40,height:40};
  const x0=from.left+from.width/2, y0=from.top+from.height/2;
  let spawned=0, arrived=0;
  const done=()=>{clearTimeout(guard);finish();};
  const guard=setTimeout(done,n*20+2500);
  const spawn=()=>{
    const i=spawned++;
    const carry=base+(i<rem?1:0);
    const pr=pill.getBoundingClientRect();
    const x1=pr.left+pr.width/2, y1=pr.top+pr.height/2;
    const jx=(Math.random()-.5)*60, jy=(Math.random()-.5)*20;
    const el=h('div',{class:'flyp','aria-hidden':'true',text:'⭐'});
    document.body.append(el);
    const a=el.animate([
      {transform:'translate('+(x0+jx-11)+'px,'+(y0+jy-11)+'px) scale(1)',opacity:1},
      {transform:'translate('+(x1-11)+'px,'+(y1-11)+'px) scale(.35)',opacity:.6}
    ],{duration:750,easing:'cubic-bezier(.6,0,1,.5)',fill:'forwards'});
    const land=()=>{
      el.remove(); arrived++;
      GP.shown+=carry; updateGamePill();
      pill.classList.add('bump'); setTimeout(()=>pill.classList.remove('bump'),70);
      if(arrived>=n) done();
    };
    a.onfinish=land; a.oncancel=land;
    if(spawned<n) requestAnimationFrame(spawn);
  };
  requestAnimationFrame(spawn);
}

/* ---------- audio / wake lock ---------- */
let audioCtx=null;
function ensureAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC&&!audioCtx) audioCtx=new AC();
    if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    ensureAudio(); if(!audioCtx) return;
    [0,.28,.56].forEach(t=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.16);
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}
let wl=null;
async function lockScreen(){
  try{
    if('wakeLock' in navigator && !wl){
      wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',()=>{wl=null;});
    }
  }catch(e){wl=null;}
}
function unlockScreen(){try{wl&&wl.release();}catch(e){} wl=null;}

/* ---------- timer logic ---------- */
const FL={subj:null,view:'subj',busy:false};   /* 画面の段階: subj=教科選択 / task=タスク一覧 / timer=学習タイマー / result=結果入力 */
function elapsedMs(){const t=S.timer;return t.accMs+(t.status==='running'?Date.now()-t.startedAt:0);}
function todayMin(){
  const k=dkey(Date.now());
  let m=sum(S.sessions.filter(x=>dkey(x.start)===k),x=>x.min);
  if(S.timer.status!=='idle') m+=elapsedMs()/60000;
  return m;
}
function startTimer(){
  const t=S.timer; ensureAudio(); S.lastResult=null;
  if(t.status==='idle'){t.accMs=0;t.sessionStart=Date.now();T.al=0;S.rec=null;}
  t.status='running';t.startedAt=Date.now();
  saveStore();lockScreen();renderTimer();
}
function pauseTimer(){
  const t=S.timer; t.accMs=elapsedMs();t.status='paused';
  if(T.al===1) T.al=2;
  saveStore();unlockScreen();renderTimer();
}
function resetTimer(){
  const t=S.timer; t.status='idle';t.accMs=0;t.startedAt=0;t.sessionStart=0;T.al=0;
  S.finishing=null;FL.view='subj';FL.subj=null;saveStore();unlockScreen();renderTimer();
}
function openFinish(){
  const t=S.timer;
  if(t.status==='running'){t.accMs=elapsedMs();t.status='paused';unlockScreen();}
  S.finishing=newFinishing(Math.max(1,Math.min(600,Math.round(t.accMs/60000))));
  FL.view='result';
  saveStore();renderTimer();
}
function cancelFinish(){
  S.finishing=null; FL.view='timer';
  const t=S.timer; if(t.status==='paused') startTimer(); else renderTimer();
}
function saveFinish(btn){
  const f=S.finishing,t=S.timer;
  const min=Number(f.min), amt=f.amount===''?0:Number(f.amount);
  if(!(min>=1&&min<=600)){toast('時間は1〜600分の間で入れてください');return;}
  if(!(amt>=0&&amt<=100000)){toast('量は0以上の数で入れてください');return;}
  const tg=tagOf(t.subject);
  const rec={
    id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    start:t.sessionStart||Date.now()-min*60000, min:min, subject:t.subject,
    task:(t.task||'').trim(), amount:amt, unit:f.unit, focus:f.focus, note:''
  };
  const from=btn?btn.getBoundingClientRect():null;
  GP={shown:ManabiGame.getPoints()};          /* 表示だけ遅らせる。ポイント自体は下で1回だけ加算される */
  const gs=addSession(rec);
  S.units[t.subject]=f.unit;
  markTodayDone(t.subject);                   /* 今日のタスクなら完了にする */
  const me=withEff(S.sessions).find(x=>x.id===rec.id);
  S.lastResult=makeResult(rec);
  if(gs&&gs.pts) S.lastResult.push('ごほうび +'+ManabiGame.fmt(gs.pts)+'pt'+(gs.crit?'(大成功!)':'')+'。');
  t.status='idle';t.accMs=0;t.startedAt=0;t.sessionStart=0;t.task='';T.al=0;
  S.finishing=null;FL.view='subj';FL.subj=null;
  saveStore();unlockScreen();renderTimer();renderBanner();
  playReward({pts:(gs&&gs.pts)||0,color:tg.c,eff:me?me.eff:null,from:from});
  toast(gameMsg('記録しました',gs,null));
}
function addSession(rec){
  if(S.sample){S.sessions=[];S.sample=false;}
  S.sessions.push(rec);saveStore();
  return gAwardSession(rec);
}
function makeResult(rec){
  const all=withEff(S.sessions), me=all.find(x=>x.id===rec.id), sj=tagOf(rec.subject);
  const lines=[tl(sj)+' '+fmtMin(rec.min)+(rec.amount>0?'・'+fmtNum(rec.amount)+rec.unit:'')];
  if(rec.amount>0){
    lines.push('ペースは1時間あたり '+fmtNum(rec.amount/rec.min*60)+rec.unit+'です。');
    if(me&&me.eff!=null){
      const d=Math.round(me.eff-100);
      lines.push(Math.abs(d)<=3?'いつもの'+sj.name+'のペースと同じくらいです。':'いつもの'+sj.name+'のペースより '+(d>0?'+':'−')+Math.abs(d)+'% '+(d>0?'はやい':'ゆっくり')+'です。');
    }else lines.push('同じ教科・同じ単位の記録が3回たまると、いつものペースとの比べ方が出ます。');
  }else lines.push('量を入れると、ペース(効率)を調べられます。');
  return lines;
}

/* ---------- shared UI pieces ---------- */
const TGS={};
function chips(sel,onPick,onNew,ctx){
  ctx=ctx||'x';
  const st=TGS[ctx]||(TGS[ctx]={open:new Set(),last:null});
  const keyOf=sj=>(normName(sj.name)===normName(sj.subj||sj.name))?'':normName(sj.subj);
  const groups=[],idx={};
  SUBJECTS.forEach(sj=>{
    const k=keyOf(sj);
    if(idx[k]==null){idx[k]=groups.length;groups.push({k:k,label:String(sj.subj||''),list:[]});}
    groups[idx[k]].list.push(sj);
  });
  if(st.last!==sel){st.last=sel;const cur=SUBJ[sel];if(cur) st.open.add(keyOf(cur));}
  const box=h('div',{class:'tgroups',role:'radiogroup','aria-label':'タスクタグ'});
  const chipEl=sj=>h('button',{type:'button',class:'chip'+(sj.id===sel?' on':''),role:'radio','aria-checked':String(sj.id===sel),on:{click:()=>onPick(sj.id)}},
    h('i',{class:'dot',style:'background:'+sj.c}),sj.name);
  const draw=()=>{
    const kids=groups.map(g=>{
      if(g.k==='') return h('div',{class:'chips'},g.list.map(chipEl));
      const open=st.open.has(g.k), selTag=g.list.find(x=>x.id===sel);
      const head=h('button',{type:'button',class:'tgh'+(selTag?' has':''),'aria-expanded':String(open),
        on:{click:()=>{if(st.open.has(g.k)) st.open.delete(g.k); else st.open.add(g.k); draw();}}},
        s('svg',{class:'tgv',viewBox:'0 0 12 12',width:'12',height:'12','aria-hidden':'true'},s('path',{d:'M4 2l4 4-4 4',fill:'none',stroke:'currentColor','stroke-width':'1.8','stroke-linecap':'round','stroke-linejoin':'round'})),
        h('i',{class:'dot',style:'background:'+g.list[0].c}),
        h('span',{class:'tgl2',text:g.label}),
        (selTag&&!open)?h('span',{class:'tgs',text:'選択中: '+selTag.name}):null,
        h('span',{class:'tgn',text:g.list.length+'個'}));
      return h('div',{class:'tg'},head,open?h('div',{class:'chips tgp'},g.list.map(chipEl)):null);
    });
    if(onNew) kids.push(h('div',{class:'chips'},h('button',{type:'button',class:'chip add',on:{click:onNew}},'＋ タスクタグをつくる')));
    box.replaceChildren(...kids);
  };
  draw();
  return box;
}

/* ---------- tags: create / edit / delete ---------- */
let uid=0;
const hexOf=c=>/^#[0-9a-f]{6}$/i.test(c)?String(c).toLowerCase():(DEFAULT_HEX[c]||'#2a78d6');
const newTagId=()=>'t'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
const tagUsed=id=>(!S.sample&&S.sessions.some(x=>x.subject===id))||S.routines.some(r=>r.subject===id);
function afterTagChange(){if(S.sample) S.sessions=makeSample(); saveStore();}
function subjectList(){
  const out=[],seen=new Set();
  const add=n=>{n=String(n==null?'':n).trim().slice(0,20);const k=normName(n);if(!n||seen.has(k))return;seen.add(k);out.push(n);};
  SUBJECTS.forEach(x=>add(x.subj||x.name));
  S.board.subjects.forEach(x=>add(x.name));
  DEFAULT_SUBJS.forEach(add);
  return out;
}
function subjColor(n){const k=normName(n);const t=k?SUBJECTS.find(x=>normName(x.subj||x.name)===k):null;return t?t.c:null;}
/* ---------- タスクタグの共有(コピー&貼り付け) ---------- */
const TSH={open:false};
function encodeTags(){
  return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,t:SUBJECTS.map(t=>({s:t.subj||t.name,n:t.name,u:t.unit,c:t.c}))})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeTags(text){
  const m=/TGS1:([A-Za-z0-9_-]+)/.exec(text||''); if(!m) return null;
  try{
    let b=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o||!Array.isArray(o.t)) return null;
    const out=[];
    o.t.slice(0,40).forEach(x=>{
      if(!x||typeof x!=='object') return;
      const sj=cutStr(x.s,20), nm=cutStr(x.n,20); if(!sj||!nm) return;
      out.push({s:sj,n:nm,u:UNITS.indexOf(x.u)>=0?x.u:'ページ',c:(typeof x.c==='string'&&(/^#[0-9a-f]{6}$/i.test(x.c)||/^var\(--s[1-6]\)$/.test(x.c)))?x.c:''});
    });
    return out.length?out:null;
  }catch(e){return null;}
}
function tagShareText(){
  const L=['【タスクタグ】共有データ','アプリの「タイマー」→「せってい」→「共有・取り込み」の取り込み欄に、この文章をそのまま貼り付けてください。',''];
  const g=[],idx={};
  SUBJECTS.forEach(t=>{const k=normName(t.subj||t.name);if(idx[k]==null){idx[k]=g.length;g.push({n:t.subj||t.name,list:[]});}g[idx[k]].list.push(t.name);});
  g.forEach(x=>L.push('■'+x.n+': '+x.list.join('、')));
  L.push('','TGS1:'+encodeTags());
  return L.join('\n');
}
function tagImpPreview(text){
  if(!String(text||'').trim()) return '';
  const d=decodeTags(text);
  if(!d) return '共有データが見つかりません。「TGS1:」で始まる行まで含めて貼り付けてください。';
  const subs=new Set(d.map(x=>normName(x.s)));
  return d.length+'個のタスクタグ(教科'+subs.size+'つ)を読み取りました。';
}
function applyTags(list){
  let added=0,had=0,skipped=0;
  list.forEach(x=>{
    if(SUBJECTS.some(t=>normName(t.name)===normName(x.n)&&normName(t.subj||t.name)===normName(x.s))){had++;return;}
    if(SUBJECTS.length>=20skipped++;return;}
    SUBJECTS.push({id:newTagId(),name:x.n,subj:x.s,unit:x.u,c:x.c||subjColor(x.s)||PRESET_COLORS[SUBJECTS.length%PRESET_COLORS.length]});
    rebuildSubj();added++;
  });
  if(added) afterTagChange();
  return {added:added,had:had,skipped:skipped};
}
function tagSharePanel(redraw){
  const out=h('textarea',{class:'out',id:'tg-share-out',readonly:true,rows:'6','aria-label':'共有用の文章'},tagShareText());
  const imp=h('textarea',{class:'out',id:'tg-imp',rows:'4',placeholder:'共有された文章を貼り付け','aria-label':'共有された文章を貼り付け'});
  const pv=h('p',{class:'note',id:'tg-imp-pv',style:'margin-top:6px;min-height:1.4em'});
  imp.addEventListener('input',()=>{pv.textContent=tagImpPreview(imp.value);});
  const copy=()=>{
    const fail=()=>{out.focus();out.select();toast('選択しました。コピーして使ってください');};
    try{navigator.clipboard.writeText(out.value).then(()=>toast('コピーしました。貼り付けて送れます'),fail);}catch(e){fail();}
  };
  const run=()=>{
    const d=decodeTags(imp.value);
    if(!d){toast('取り込める共有データが見つかりません');return;}
    const r=applyTags(d);
    TSH.open=false;saveStore();renderTimer();redraw();
    toast(r.added?r.added+'個のタスクタグを追加しました'+(r.had?'('+r.had+'個はすでにありました)':'')+(r.skipped?'。'+r.skipped+'個は20個の上限で追加できませんでした':''):(r.had?'すでに同じタスクタグがあります':'追加できませんでした(タグは20個までです)'));
  };
  return h('div',{class:'tagedit'},
    h('div',{style:'font-weight:700;font-family:var(--f-disp)',text:'タスクタグを共有する'}),
    h('p',{class:'note',style:'margin-top:4px',text:'教科とタスク名、単位、色が入ります。LINEやメールに貼り付けて送ると、受け取った人が取り込めます。'}),
    h('label',{class:'l',for:'tg-share-out',text:'共有用の文章'}),out,
    h('div',{class:'btns',style:'justify-content:flex-start;margin-top:10px'},h('button',{type:'button',class:'btn pri sm',on:{click:copy}},'コピーする')),
    h('div',{class:'l',style:'margin-top:16px',text:'共有された文章を取り込む'}),
    imp,pv,
    h('div',{class:'btns',style:'justify-content:flex-start'},
      h('button',{type:'button',class:'btn pri sm',on:{click:run}},'いまのタグに追加'),
      h('button',{type:'button',class:'btn sm',on:{click:()=>{TSH.open=false;redraw();}}},'閉じる')),
    h('p',{class:'note',style:'margin-top:8px',text:'同じ教科・同じ名前のタグは追加されません。記録や毎日のタスクは取り込まれません。'}));
}

/* 教科カードが上へ動いて横に広がり、ほかのカードは消える */
function chooseSubject(k,el){
  if(FL.busy) return;
  const first=el?el.getBoundingClientRect():null;
  const go=()=>{
    FL.busy=false; FL.subj=k; FL.view='task'; renderTimer();
    const bar=$('#subjBar'); if(!bar||!first||!bar.animate||reduceMotion()) return;
    const last=bar.getBoundingClientRect();
    const dx=first.left-last.left, dy=first.top-last.top, sx=first.width/last.width, sy=first.height/last.height;
    bar.animate([
      {transformOrigin:'0 0',transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},
      {transformOrigin:'0 0',transform:'none'}
    ],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});
    const inner=bar.querySelector('.sbi');
    if(inner) inner.animate([{opacity:0},{opacity:0,offset:.55},{opacity:1}],{duration:420});
    const tg=$('#taskGrid');
    if(tg) tg.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:340,delay:200,fill:'backwards',easing:'ease-out'});
  };
  if(!el||reduceMotion()){go();return;}
  FL.busy=true;
  document.querySelectorAll('#subjGrid .cardbtn, .omakase').forEach(b=>{if(b!==el){b.style.transition='opacity .2s ease';b.style.opacity='0';}});
  setTimeout(go,210);
}

function heatCard(){
  const dm=dayMap(S.sessions), today0=startOfDay(Date.now());
  const dow=(new Date(today0).getDay()+6)%7, start=addDays(today0,-dow-28);
  const names=['月','火','水','木','金','土','日'];
  const grid=h('div',{class:'heat',role:'group','aria-label':'直近5週間の学習時間'});
  grid.append(h('span',{class:'hl'}),...names.map(n=>h('span',{class:'hl',text:n})));
  for(let wk=0;wk<5;wk++){
    const wd=new Date(addDays(start,wk*7));
    grid.append(h('span',{class:'hl hwl',text:(wd.getMonth()+1)+'/'+wd.getDate()}));
    for(let c=0;c<7;c++){
      const ms=addDays(start,wk*7+c);

      const o=dm.get(dkey(ms)), min=o?o.min:0, lv=min<=0?0:Math.min(5,Math.ceil(min/30));

      attachTip(cell,()=>({title:dateLong(ms),rows:[{label:'学習時間',value:fmtMin(min)}]}));
      grid.append(cell);
    }
  }
  return h('div',{class:'card'},h('h2',{text:'この5週間'}),
    h('p',{class:'sub',text:'1マスが1日。上が古い週、下がいまの週です。左の日付は、その週の月曜日です。'}),grid,
    h('div',{class:'legend'},h('span',{text:'少ない'}),h('span',{class:'sw'},[0,1,2,3,4,5].map(i=>h('i',{style:'background:var(--h'+i+')'}))),h('span',{text:'多い(30分ごとに1段階)'})));
}

  }

  L.forEach(x=>{const p=taPrev(x);if(p&&x.dev!=null&&p.dev!=null) ch.push({x:x,p:p,d:x.dev-p.dev});});
  if(ch.length){

    if(up.d>=0.05) parts.push('「'+up.x.subject+'」が '+taSd(up.d)+'(前回「'+up.p.name+'」から。いちばん上がった教科)');
    if(dn.d<=-0.05) parts.push('「'+dn.x.subject+'」が '+taSd(dn.d)+'(いちばん下がった教科)');

}
function drawDevBars(box,rows){

  const vs=rows.filter(r=>r.dev!=null).map(r=>r.dev);

  const y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;

  for(let v=lo;v<=hi;v+=10){

      s('text',{x:m.l-7,y:y(v)+4,'text-anchor':'end',class:'tick',text:String(v)}));
  }

      const ye=y(r.dev);
      svg.append(s('path',{d:barPath(cx,bw,y(50),ye,4),style:'fill:'+(r.dev>=50?'var(--hi)':'var(--dim)')}),
        s('text',{x:cx,y:r.dev>=50?ye-6:ye+15,'text-anchor':'middle',class:'vlab halo',text:taNum(r.dev)}));
    }else svg.append(s('text',{x:cx,y:y(50)-6,'text-anchor':'middle',class:'xs',text:'—'}));
    svg.append(s('text',{x:cx,y:H-m.b+18,'text-anchor':'middle',class:'xl',text:r.name.length>mc?r.name.slice(0,mc):r.name}));
    const hit=s('rect',{x:m.l+slot*i,y:m.t,width:slot,height:ih,class:'hit',tabindex:'0',role:'img','aria-label':r.name+' '+(r.dev!=null?'偏差値'+taNum(r.dev):'偏差値なし')});
    attachTip(hit,()=>{
      const rs=[];

      if(r.avg!=null) rs.push({label:'平均点',value:taNum(r.avg)});

}
function drawTrend(box,asc,series){

function taSave(){
  const f=TA.form, name=f.name.trim(), sj=f.subject.trim();
  const full=f.full===''?100:Number(f.full), sc=f.score===''?NaN:Number(f.score);
  const av=f.avg===''?null:Number(f.avg), dv=f.dev===''?null:Number(f.dev);
  if(!name){toast('テストの名前を入れてください(例:二学期中間)');return;}
  if(!okYmd(f.date)){toast('テストが終わった日を入れてください');return;}
  if(ymdMs(f.date)>startOfDay(Date.now())){toast('これからの日付は入れられません');return;}
  if(!sj){toast('教科を入れてください');return;}
  if(!(full>0&&full<=1000)){toast('満点は1〜1000の数で入れてください');return;}
  if(!(sc>=0&&sc<=full)){toast('点数は0〜満点の間で入れてください');return;}
  if(av!=null&&!(av>=0&&av<=full)){toast('平均点は0〜満点の間で入れてください');return;}
  if(dv!=null&&!(dv>0&&dv<=100)){toast('偏差値は0より大きく100以下で入れてください');return;}
  const rec={id:f.id||bid(),name:name.slice(0,30),subject:sj.slice(0,20),date:f.date,score:sc,full:full,avg:av,dev:dv};
  let msg='保存しました。続けて別の教科も入れられます';
  if(f.id){
    const i=S.tests.findIndex(x=>x.id===f.id);
    if(i>=0) S.tests[i]=rec; else S.tests.push(rec);
    msg='直しました';
  }else{
    const dup=S.tests.findIndex(x=>normName(x.name)===normName(rec.name)&&normName(x.subject)===normName(rec.subject));
    if(dup>=0){rec.id=S.tests[dup].id;S.tests[dup]=rec;msg='同じテストの同じ教科だったので、結果を更新しました';}
    else{
      if(S.tests.length>=300){toast('結果は300件までです。古いものを消してください');return;}
      S.tests.push(rec);
    }
  }
  TA.sel=normName(rec.name); TA.open=true; saveStore();
  const wasEdit=!!f.id;
  TA.form=Object.assign(taBlank(),{name:rec.name,date:rec.date});

function csvCell(v){

function exportData(kind){
  if(S.sample&&!S.tests.length){toast('まだ自分の記録がありません');return;}
  let text,name;
  if(kind==='json'){
    text=JSON.stringify({app:'manabilog',v:1,exported:new Date().toISOString(),goalMin:S.goalMin,tags:SUBJECTS,sessions:S.sample?[]:S.sessions,board:S.bsample?undefined:boardCompact(),routines:S.rsample?undefined:S.routines,tests:S.tests,game:ManabiGame.exportData()});
    name='manabilog-backup.json';
  }else{
    if(S.sample){toast('まだ自分の記録がありません');return;}
    const rows=[['日付','開始時刻','教科','タスク','メモ','時間(分)','量','単位','集中度','ひとこと']];
    S.sessions.slice().sort((a,b)=>a.start-b.start).forEach(x=>{
      const d=new Date(x.start);
      rows.push([dkey(x.start),p2(d.getHours())+':'+p2(d.getMinutes()),tagOf(x.subject).subj||tagOf(x.subject).name,tagOf(x.subject).name,x.task,Math.round(x.min*10)/10,x.amount,x.unit,x.focus,x.note]);
    });
    text='﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
    name='manabilog.csv';
  }
  S.exportText=text;renderLog();
}
function importData(text){
  try{
    const o=JSON.parse(text); const arr=Array.isArray(o)?o:o.sessions;
    if(!Array.isArray(arr)) throw new Error('bad');
    let nt=0;
    if(!Array.isArray(o)&&Array.isArray(o.tags)){
      o.tags.forEach(tg=>{
        if(!validTag(tg)||SUBJ[tg.id]||SUBJECTS.length>=20) return;
        const isub=(typeof tg.subj==='string'&&tg.subj.trim())?tg.subj.trim().slice(0,20):tg.name.trim();
        const dup=SUBJECTS.some(x=>normName(x.name)===normName(tg.name)&&normName(x.subj||x.name)===normName(isub));
        SUBJECTS.push({id:tg.id,name:dup?tg.name.trim().slice(0,15)+'(取込)':tg.name.trim(),subj:isub,unit:tg.unit,c:tg.c});
        rebuildSubj();
      });
    }
    if(!Array.isArray(o)){
      if(o.game&&typeof o.game==='object'){try{ManabiGame.importData(o.game);}catch(e){}}
      const nbd=fromCompact(o.board);
      if(nbd){
        if(S.bsample){S.board={subjects:[]};S.bsample=false;}
        const names=new Set(S.board.subjects.map(x=>normName(x.name)));
        nbd.forEach(x=>{if(!names.has(normName(x.name))){S.board.subjects.push(x);names.add(normName(x.name));}});
      }
      const nrt=normRoutines(o.routines);
      if(nrt&&nrt.length){
        if(S.rsample){S.routines=[];S.rsample=false;}
        const sig=r=>r.subject+'|'+normName(r.name)+'|'+r.days.join('');
        const have2=new Set(S.routines.map(sig));
        nrt.forEach(r=>{if(!SUBJ[r.subject]||S.routines.length>=40||have2.has(sig(r)))return;have2.add(sig(r));S.routines.push(r);});
      }
      const tsts=normTests(o.tests);
      const tk=t=>normName(t.name)+'|'+normName(t.subject);
      const haveT=new Set(S.tests.map(tk)), haveId=new Set(S.tests.map(t=>t.id));
      tsts.forEach(t=>{
        if(S.tests.length>=300||haveT.has(tk(t))) return;
        if(haveId.has(t.id)) t.id=bid();
        haveT.add(tk(t)); haveId.add(t.id); S.tests.push(t); nt++;
      });
    }
    const have=new Set(S.sample?[]:S.sessions.map(x=>x.id));
    let n=0; const base=S.sample?[]:S.sessions.slice();
    arr.forEach(x=>{
      if(!x||typeof x!=='object') return;
      const start=Number(x.start), min=Number(x.min);
      if(!(start>0)||!(min>=1&&min<=600)) return;
      const sid=SUBJ[x.subject]?x.subject:SUBJECTS[0].id;
      const id=typeof x.id==='string'&&x.id?x.id.slice(0,40):'i'+start;
      if(have.has(id)) return; have.add(id);
      base.push({id:id,start:start,min:min,subject:sid,task:String(x.task||'').slice(0,60),amount:Math.max(0,Number(x.amount)||0),unit:UNITS.indexOf(x.unit)>=0?x.unit:tagOf(sid).unit,focus:Math.max(0,Math.min(5,Math.round(Number(x.focus)||0))),note:String(x.note||'').slice(0,80)});
      n++;
    });
    if(n||!S.sample){S.sessions=base;S.sample=false;}
    saveStore();renderBanner();renderLog();
    toast(n+'件を読み込みました'+(nt?'(テスト結果'+nt+'件も)':''));
  }catch(e){toast('読み込めませんでした。書き出したJSONファイルを選んでください');}
}

function xLabels(svg,n,xf,from,y){
  const step=n<=7?1:n<=14?2:5;
  for(let i=0;i<n;i++){
    if((n-1-i)%step!==0) continue;
    const d=new Date(addDays(from,i));
    svg.append(s('text',{x:xf(i),y:y,'text-anchor':'middle',class:'xl',text:(d.getMonth()+1)+'/'+d.getDate()}),
               s('text',{x:xf(i),y:y+13,'text-anchor':'middle',class:'xs',text:WD[d.getDay()]}));
  }
}
function barPath(cx,bw,yBase,yEnd,r){
  const x0=cx-bw/2,x1=cx+bw/2,up=yEnd<yBase,hg=Math.abs(yEnd-yBase);
  if(hg<.5) return '';
  r=Math.min(r,hg/2,bw/2);
  return up
    ?'M'+x0+','+yBase+'V'+(yEnd+r)+'Q'+x0+','+yEnd+' '+(x0+r)+','+yEnd+'H'+(x1-r)+'Q'+x1+','+yEnd+' '+x1+','+(yEnd+r)+'V'+yBase+'Z'
    :'M'+x0+','+yBase+'V'+(yEnd-r)+'Q'+x0+','+yEnd+' '+(x0+r)+','+yEnd+'H'+(x1-r)+'Q'+x1+','+yEnd+' '+x1+','+(yEnd-r)+'V'+yBase+'Z';
}

function drawDaily(box,days,goal,from){
  const w=box.clientWidth,H=236,m={l:38,r:10,t:20,b:36},iw=w-m.l-m.r,ih=H-m.t-m.b,n=days.length;
  const mx=Math.max(goal*1.02,...days.map(d=>d.total),30);
  const step=[15,20,30,60,90,120,180,240].find(v=>mx/v<=5)||300, top=Math.ceil(mx/step)*step;
  const y=v=>m.t+ih-(v/top)*ih;
  const svg=s('svg',{width:w,height:H,viewBox:'0 0 '+w+' '+H,role:'img','aria-label':'毎日の学習時間(タスクタグ別の積み上げ)。数値は下の表でも確認できます。'});
  for(let v=0;v<=top;v+=step){
    svg.append(s('line',{x1:m.l,x2:w-m.r,y1:y(v),y2:y(v),class:v===0?'axis':'grid'}),
      s('text',{x:m.l-7,y:y(v)+4,'text-anchor':'end',class:'tick',text:String(v)}));
  }
  svg.append(s('text',{x:m.l-7,y:m.t-8,'text-anchor':'end',class:'tick',text:'分'}));
  const slot=iw/n,bw=Math.min(24,Math.max(6,slot*.62));
  days.forEach((d,i)=>{
    const cx=m.l+slot*(i+.5);
    const band=s('rect',{x:m.l+slot*i,y:m.t,width:slot,height:ih,class:'band'});
    svg.append(band);
    let acc=0; const segs=SUBJECTS.filter(sj=>d.by[sj.id]>0);
    segs.forEach((sj,k)=>{
      const v=d.by[sj.id],y1=y(acc+v),y0=y(acc);acc+=v;
      const isTop=k===segs.length-1,t1=isTop?y1:y1+2,hg=y0-t1;
      if(hg<1) return;
      if(isTop) svg.append(s('path',{d:barPath(cx,bw,y0,y1,4),style:'fill:'+sj.c}));
      else svg.append(s('rect',{x:cx-bw/2,y:t1,width:bw,height:hg,style:'fill:'+sj.c}));
    });
    const hit=s('rect',{x:m.l+slot*i,y:m.t,width:slot,height:ih,class:'hit',tabindex:'0',role:'img','aria-label':dateLong(addDays(from,i))+' '+fmtMin(d.total)});
    attachTip(hit,()=>({title:dateLong(addDays(from,i)),rows:[{label:'合計',value:fmtMin(d.total)}].concat(segs.slice().reverse().map(sj=>({color:sj.c,label:tl(sj),value:fmtMin(d.by[sj.id])})))}));
    hit.addEventListener('pointerenter',()=>{band.style.opacity='.55';});
    hit.addEventListener('pointerleave',()=>{band.style.opacity='0';});
    hit.addEventListener('focus',()=>{band.style.opacity='.55';});
    hit.addEventListener('blur',()=>{band.style.opacity='0';});
    svg.append(hit);
  });
  if(goal<=top){
    svg.append(s('line',{x1:m.l,x2:w-m.r,y1:y(goal),y2:y(goal),class:'goal'}),
      s('text',{x:w-m.r,y:y(goal)-5,'text-anchor':'end',class:'lab halo',text:'目標 '+goal+'分'}));
  }
  xLabels(svg,n,i=>m.l+slot*(i+.5),from,H-m.b+16);
  box.replaceChildren(svg);
}

function drawEff(box,days,from){
  const w=box.clientWidth,H=224,m={l:42,r:34,t:18,b:36},iw=w-m.l-m.r,ih=H-m.t-m.b,n=days.length;
  const pts=days.map((d,i)=>({i:i,d:d})).filter(p=>p.d.eff!=null);
  const vals=pts.map(p=>p.d.eff);
  const lo=Math.min(80,Math.floor((Math.min(...vals)-4)/10)*10),hi=Math.max(120,Math.ceil((Math.max(...vals)+4)/10)*10);
  const step=(hi-lo)>60?20:10;
  const x=i=>m.l+(n===1?iw/2:iw*i/(n-1)),y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  const svg=s('svg',{width:w,height:H,viewBox:'0 0 '+w+' '+H,role:'img','aria-label':'効率指数の推移。100がいつもの自分です。'});
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
    svg.append(s('line',{x1:m.l,x2:w-m.r,y1:y(v),y2:y(v),class:v===100?'axis':'grid'}),
      s('text',{x:m.l-7,y:y(v)+4,'text-anchor':'end',class:'tick',text:String(v)}));
  }
  svg.append(s('text',{x:m.l+4,y:y(100)-6,class:'lab halo',text:'いつもの自分'}));
  let dpath='';
  pts.forEach((p,k)=>{dpath+=(k?'L':'M')+x(p.i)+','+y(p.d.eff);});

  svg.append(cross);
  const tipOf=p=>({title:dateLong(addDays(from,p.i)),rows:[{color:'var(--hi)',label:'効率指数',value:String(Math.round(p.d.eff))},{label:'学習時間',value:fmtMin(p.d.total)}]});
  pts.forEach(p=>{
    const c=s('circle',{cx:x(p.i),cy:y(p.d.eff),r:4,class:'pt',tabindex:'0',role:'img','aria-label':dateLong(addDays(from,p.i))+' 効率指数'+Math.round(p.d.eff)});
    attachTip(c,()=>tipOf(p));
    c.addEventListener('focus',()=>{cross.setAttribute('x1',x(p.i));cross.setAttribute('x2',x(p.i));cross.style.opacity='1';});
    c.addEventListener('blur',()=>{cross.style.opacity='0';});
    svg.append(c);
  });
  const last=pts[pts.length-1];
  svg.append(s('text',{x:x(last.i)+9,y:y(last.d.eff)+4,class:'vlab halo',text:String(Math.round(last.d.eff))}));
  const ov=s('rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent'});
  attachTip(ov,()=>null);
  const nearest=e=>{
    const r=svg.getBoundingClientRect(),px=e.clientX-r.left;
    let best=pts[0],bd=1e9;
    pts.forEach(p=>{const dd=Math.abs(x(p.i)-px);if(dd<bd){bd=dd;best=p;}});
    cross.setAttribute('x1',x(best.i));cross.setAttribute('x2',x(best.i));cross.style.opacity='1';
    const c=tipOf(best);showTip(e.clientX,e.clientY,c);
  };
  ['pointermove','pointerdown'].forEach(ev=>ov.addEventListener(ev,nearest));
  ov.addEventListener('pointerleave',()=>{cross.style.opacity='0';hideTip();});
  ov.style.touchAction='pan-y';
  svg.append(ov);
  xLabels(svg,n,x,from,H-m.b+16);
  box.replaceChildren(svg);
}

function drawDiv(box,bk,best,what){
  const w=box.clientWidth,H=236,m={l:46,r:6,t:18,b:58},iw=w-m.l-m.r,ih=H-m.t-m.b;

  const lim=Math.max(20,Math.ceil((Math.max(0,...devs)+9)/10)*10);
  const y=v=>m.t+ih/2-v/lim*(ih/2);
  const svg=s('svg',{width:w,height:H,viewBox:'0 0 '+w+' '+H,role:'img','aria-label':what+'ごとの効率。いつもの自分との差を示します。'});
  [-lim,-lim/2,0,lim/2,lim].forEach(v=>{
    svg.append(s('line',{x1:m.l,x2:w-m.r,y1:y(v),y2:y(v),class:v===0?'axis':'grid'}),
      s('text',{x:m.l-7,y:y(v)+4,'text-anchor':'end',class:'tick',text:v===0?'いつも':(v>0?'+':'−')+Math.abs(v)+'%'}));

      const rd=Math.round(dev);
      svg.append(s('text',{x:cx,y:dev>=0?ye-6:ye+15,'text-anchor':'middle',class:'vlab halo',text:rd===0?'±0%':(rd>0?'+':'−')+Math.abs(rd)+'%'}));
    }
    const isBest=i===best;
    svg.append(
      s('text',{x:cx,y:H-m.b+18,'text-anchor':'middle',class:'xl',style:isBest?'font-weight:700;fill:var(--ink)':null,text:b.k}),
      s('text',{x:cx,y:H-m.b+32,'text-anchor':'middle',class:'xs',text:b.sub}),
      s('text',{x:cx,y:H-m.b+46,'text-anchor':'middle',class:'xs',style:isBest?'font-weight:700;fill:var(--ink)':null,text:b.n>0?b.n+'回'+(isBest?' ベスト':''):'—'}));
    const hit=s('rect',{x:m.l+slot*i,y:m.t,width:slot,height:H-m.t-6,class:'hit',tabindex:'0',role:'img','aria-label':b.name+' '+(b.show?'効率指数'+Math.round(b.eff):'記録が足りません')});
    attachTip(hit,()=>({title:b.name,rows:b.show
      ?[{color:b.eff>=100?'var(--hi)':'var(--dim)',label:'効率指数',value:String(Math.round(b.eff))},{label:'記録',value:b.n+'回'},{label:'合計',value:fmtMin(b.mins)}]
      :[{label:'記録',value:b.n+'回(2回以上で表示)'}]}));
    svg.append(hit);
  });
  box.replaceChildren(svg);
}

function bucketize(E,defs,keyOf){
  const bk=defs.map(d=>{
    const list=E.filter(x=>{const v=keyOf(x);return v>=d.lo&&v<d.hi;});
    return {k:d.k,sub:d.sub,name:d.name,n:list.length,mins:sum(list,x=>x.min),eff:list.length?wavg(list):null,show:list.length>=2};
  });
  let best=-1,bv=103;
  bk.forEach((b,i)=>{if(b.n>=3&&b.eff>bv){bv=b.eff;best=i;}});
  return {bk:bk,best:best};
}
const sgn=d=>(d>0?'+':'−')+Math.abs(d);

function makeInsights(R,E,LB,TB,from,today0){
  const out=[];
  if(E.length<6){
    out.push({tag:'はじめに',text:'効率の傾向は、量を入れた記録が6回以上たまると出てきます。いまは'+E.length+'回です。(同じ教科で3回以上の記録も必要です)'});
    return out;
  }
  if(LB.best>=0){const b=LB.bk[LB.best];out.push({tag:'長さ',text:'「'+b.name+'」のまとまりで取り組んだときが、いつものペースより '+sgn(Math.round(b.eff-100))+'% で、いちばん効率がよい傾向です。('+b.n+'回)'});}
  if(TB.best>=0){const b=TB.bk[TB.best];out.push({tag:'時間帯',text:'「'+b.name+'」に始めた記録が、いつものペースより '+sgn(Math.round(b.eff-100))+'% で、いちばん効率がよい傾向です。('+b.n+'回)'});}
  const hiF=E.filter(x=>x.focus>=4),loF=E.filter(x=>x.focus>=1&&x.focus<=3);
  if(hiF.length>=3&&loF.length>=3){
    const d=Math.round(wavg(hiF)-wavg(loF));
    out.push({tag:'集中度',text:Math.abs(d)<=3?'集中度が高い記録と低い記録で、効率に大きな差は見られません。':'集中度を4以上にできた記録は、3以下の記録より効率指数が '+Math.abs(d)+(d>0?' 高く':' 低く')+'なっています。'});
  }
  const mid=addDays(from,Math.floor(((today0-from)/DAY+1)/2));
  let bestCh=null;
  SUBJECTS.forEach(sj=>{
    const a=E.filter(x=>x.subject===sj.id&&x.start<mid),b=E.filter(x=>x.subject===sj.id&&x.start>=mid);
    if(a.length>=2&&b.length>=2){
      const d=Math.round(wavg(b)-wavg(a));
      if(!bestCh||Math.abs(d)>Math.abs(bestCh.d)) bestCh={sj:sj,d:d};
    }
  });
  if(bestCh&&Math.abs(bestCh.d)>=5) out.push({tag:'教科',text:bestCh.sj.name+'の効率指数は、期間の前半より後半のほうが '+Math.abs(bestCh.d)+(bestCh.d>0?' 高く':' 低く')+'なっています。'});
  out.push({tag:'見かた',text:'記録の数が少ないうちは、たまたまの影響が大きくなります。目安として見てください。'});
  return out.slice(0,5);
}
